# Input for xcodegen: `xcodegen generate` creates BoseBar.xcodeproj from this file.
name: BoseBar
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  BMAPKit:
    path: .
targets:
  BoseBar:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: BMAPKit
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true # menu bar only, no Dock icon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "BoseBar steuert den Geräuschunterdrückungsmodus deiner Bose-Kopfhörer."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mschoenbein.BoseBar
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-" # ad-hoc signing, personal use only
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
